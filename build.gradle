plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.11-SNAPSHOT" apply false
    id 'io.github.juuxel.loom-quiltflower' version '1.8.0' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

def secretsFile = file('secret/secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream { stream ->
        def props = new Properties()
        props.load(stream)
        props.each { key, value ->
            project.ext.set(key, value)
        }
    }
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "io.github.juuxel.loom-quiltflower"
    apply plugin: "maven-publish"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven { url "https://maven.shedaniel.me" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.blamejared.com/" }
        maven { url 'https://jitpack.io' }
    }


    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }

    java {

    }

}


publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'eirmax'
            artifactId = 'taniwha-remaked-parent'
            version = rootProject.mod_version
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/eirmax/taniwha-remaked")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GPR_USER") ?: ""
                password = project.findProperty("gpr.key") ?: System.getenv("GPR_KEY") ?: ""
            }
        }
    }
}


task setupActions() {
    doLast {
        exec {
            commandLine "echo", "##[set-output name=modid;]${rootProject.archives_base_name}";
        }
        exec {
            commandLine "echo", "##[set-output name=version;]${rootProject.mod_version}";
        }
    }
}
